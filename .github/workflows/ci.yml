# Every quality gate from CLAUDE.md, via the same command used locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A group keeps one running and one pending run; a newly queued run cancels the pending
# one even with `cancel-in-progress: false` (GitHub docs, "Control the concurrency of
# workflows and jobs"). So:
# - PRs share one group per PR, and a newer push cancels the older run, which is pointless.
# - Pushes to `main` get one group per commit, so no other push can cancel them: every
#   commit gets a result, and the run `cargo xtask wait-ci` waits on can't end as
#   `cancelled` because of a later push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: cargo xtask ci
    # Pinned rather than ubuntu-latest, which is moving to 26.04: the package list below is
    # checked against 24.04, so the image changes only in a commit that rechecks it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Ubuntu packages from README "Building on Linux". `vulkaninfo` proves Vulkan works
      # here (lavapipe, a software renderer), which GPU tests will rely on later.
      - name: Install system packages
        run: |
          sudo apt-get update
          sed 's/#.*//' .github/ubuntu-packages.txt | xargs sudo apt-get install -y --no-install-recommends
          vulkaninfo --summary
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo xtask ci
        run: cargo xtask ci
